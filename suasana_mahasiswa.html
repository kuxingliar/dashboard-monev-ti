<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suasana Akademik Mahasiswa | Monev TI UHO</title>
<link rel="stylesheet" href="assets/style.css">

</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<div class="flex h-screen overflow-hidden">
  <aside class="sticky top-0 flex h-screen w-72.5 flex-shrink-0 flex-col overflow-y-auto border-r border-gray-200 bg-white px-5" id="sidebar"></aside>
<script>renderSidebar('suasana_mahasiswa.html');</script>
  <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
    <main>
      <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6 2xl:p-10">

        <div class="mb-6">
          <h2 class="text-title-md font-bold text-gray-800">Suasana Akademik: Mahasiswa</h2>
          <p class="text-sm text-gray-500 mt-1">Persepsi mahasiswa terhadap kebijakan, interaksi, pembelajaran, kegiatan ilmiah, sarana, dan kepuasan.</p>
        </div>

        <div class="grid grid-cols-2 gap-4 max-w-sm mb-6" id="statCards"></div>

        <div class="grid grid-cols-1 gap-4 md:gap-6 mb-6">
          <div class="rounded-2xl border border-gray-200 bg-white p-5 md:p-6">
            <h3 class="font-semibold text-gray-800 mb-4">Rata-rata per Kategori</h3>
            <div id="chartKategori" style="height:240px"></div>
            <ul class="text-xs text-gray-500 mt-3 space-y-1" id="kategoriLegend"></ul>
            <button type="button" id="toggleDetail" class="text-sm mt-4" style="color:#2F6F5E;">Lihat rincian per pertanyaan &#9662;</button>
            <div id="kategoriAccordion" class="hidden mt-3"></div>
          </div>
          <div class="rounded-2xl border border-gray-200 bg-white p-5 md:p-6">
            <h3 class="font-semibold text-gray-800 mb-4">Distribusi Skor Jawaban</h3>
            <div id="chartDist" style="height:240px"></div>
          </div>
        </div>

<script>
const sm = DATA.suasana_mahasiswa;
const KODE_KATEGORI_MHS = {
  'Kebijakan dan Peraturan Akademik': 'A',
  'Mutu Interaksi Akademik Dosen-Mahasiswa': 'B',
  'Kualitas Proses Pembelajaran': 'C',
  'Keikutsertaan dalam Kegiatan Ilmiah': 'D',
  'Sarana dan Prasarana Pendukung Akademik': 'E',
  'Kepuasan Keseluruhan': 'F',
};
document.getElementById('statCards').innerHTML = `
  <div class="rounded-2xl border border-gray-200 bg-white p-5">
    <span class="text-sm text-gray-500">Responden</span>
    <h4 class="text-title-sm mt-2 font-bold text-gray-800">${sm.ringkas.n}</h4>
  </div>
  <div class="rounded-2xl border border-gray-200 bg-white p-5">
    <span class="text-sm text-gray-500">Rata-rata</span>
    <h4 class="text-title-sm mt-2 font-bold text-gray-800">${sm.ringkas.rata.toFixed(2)}</h4>
  </div>
`;

document.getElementById('kategoriLegend').innerHTML = sm.kategori.map(c => `
  <li><strong>${KODE_KATEGORI_MHS[c.nama] || '?'}</strong>: ${esc(c.nama)}</li>
`).join('');

new ApexCharts(document.querySelector("#chartKategori"), {
  chart: { type: 'bar', height: 240, toolbar: { show: false } },
  series: [{ name: 'Rata-rata', data: sm.kategori.map(c => c.rata) }],
  xaxis: { categories: sm.kategori.map(c => KODE_KATEGORI_MHS[c.nama] || c.nama), min: 1, max: 5, labels: { style: { fontSize: '11px' } } },
  plotOptions: { bar: { horizontal: true, borderRadius: 3, distributed: true } },
  colors: barColors(sm.kategori.map(c => c.rata), 4.0),
  dataLabels: { enabled: false }, legend: { show: false },
  grid: { borderColor: '#F1F1F1' },
  tooltip: { y: { title: { formatter: (_, o) => sm.kategori[o.dataPointIndex].nama } } },
}).render();

const distOrder = [5,4,3,2,1];
new ApexCharts(document.querySelector("#chartDist"), {
  chart: { type: 'bar', height: 240, toolbar: { show: false } },
  series: [{ name: 'Jumlah', data: distOrder.map(k => sm.dist[k]) }],
  xaxis: { categories: distOrder.map(k => 'Skor '+k) },
  plotOptions: { bar: { borderRadius: 3, columnWidth: '55%' } },
  colors: [COLOR_ACCENT],
  dataLabels: { enabled: false }, legend: { show: false },
  grid: { borderColor: '#F1F1F1' },
}).render();

const qByCatMhs = {};
sm.q_avgs.forEach(q => { (qByCatMhs[q.kategori] = qByCatMhs[q.kategori] || []).push(q); });
const lowestCatMhs = sm.kategori.slice().sort((a,b) => a.rata - b.rata)[0];
const lowestKodeMhs = KODE_KATEGORI_MHS[lowestCatMhs.nama];

document.getElementById('kategoriAccordion').innerHTML = ['A','B','C','D','E','F'].map(kode => {
  const catInfo = sm.kategori.find(c => KODE_KATEGORI_MHS[c.nama] === kode);
  const qs = (qByCatMhs[kode] || []).slice().sort((a,b) => a.nomor - b.nomor);
  const isOpen = false;
  return `
    <div class="border border-gray-200 rounded-lg mb-2" style="overflow:hidden;">
      <button type="button" class="accordion-toggle w-full flex items-center justify-between px-4 py-3 text-left text-sm font-medium text-gray-800" data-kode="${kode}">
        <span>${kode}: ${esc(catInfo ? catInfo.nama : '')}</span>
        <span class="text-xs text-gray-400">rata-rata ${catInfo ? catInfo.rata.toFixed(2) : '-'}</span>
      </button>
      <div class="accordion-panel px-4 pb-3 ${isOpen ? '' : 'hidden'}" data-panel="${kode}">
        ${qs.map(q => `
          <div class="flex items-center justify-between text-sm py-1.5 border-t border-gray-100">
            <span class="text-gray-500">Q${q.nomor}: ${esc(q.teks)}</span>
            <span class="font-medium">${q.rata.toFixed(2)}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}).join('');

document.querySelectorAll('.accordion-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.accordion-panel[data-panel="' + btn.dataset.kode + '"]').classList.toggle('hidden');
  });
});

document.getElementById('toggleDetail').addEventListener('click', () => {
  const el = document.getElementById('kategoriAccordion');
  const btn = document.getElementById('toggleDetail');
  el.classList.toggle('hidden');
  btn.innerHTML = el.classList.contains('hidden') ? 'Lihat rincian per pertanyaan &#9662;' : 'Sembunyikan rincian &#9652;';
});

setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
</script>

      </div>
    </main>
  </div>
</div>
</body>
</html>
